name: aives-monitoring

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    privileged: true
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - aives

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
    networks:
      - aives

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aives

  # ── Nginx metrics (Thịnh — Nginx & Load Balancing) ──────────────────
  # nginx-prometheus-exporter đọc `stub_status` của Nginx rồi xuất ra
  # Prometheus format.
  #
  # Lưu ý: service này nằm ở project `aives-monitoring`, còn Nginx chạy ở
  # project `aives-dev` → không dùng `depends_on` được.  Hai project dùng
  # chung external network `aives-dev_default` nên vẫn gọi được nhau.
  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    command:
      - --nginx.scrape-uri=http://nginx:8088/nginx_status
    restart: unless-stopped
    networks:
      - aives

  # ── PostgreSQL metrics ──────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      # Chỉ cần user đọc metric, không cần quyền ghi.
      DATA_SOURCE_NAME: "postgresql://aives:aives-local-development@postgres:5432/aives_dev?sslmode=disable"
    restart: unless-stopped
    networks:
      - aives

networks:
  aives:
    external: true
    name: aives-dev_default

volumes:
  prometheus-data:
  grafana-data:
