# Nginx reverse proxy + load balancer cho AIVES.
#
# Vai trò (Thịnh — Nginx & Load Balancing):
#   - Nhận request từ client/k6 và phân phối round-robin tới các backend replica.
#   - Loại replica chết khỏi vòng phân phối (max_fails / fail_timeout).
#   - Ghi log kèm replica phục vụ request → dùng để chứng minh
#     "request được phân phối đến nhiều backend container".
#
# Luồng:  k6 / client → nginx:8088 → backend-1..N:8080 → postgres
#
# CÁCH CHẠY:
#   docker compose -f docker-compose.yml -f docker-compose.scaling.yml \
#       --profile scaling up -d --scale backend=3 nginx
#   docker compose -f docker-compose.yml -f docker-compose.scaling.yml \
#       --profile scaling exec nginx nginx -t
#
# GHI CHÚ KỸ THUẬT:
#   1. Docker DNS (127.0.0.11) trả về nhiều bản ghi A cho service đã scale.
#      Nginx resolve hostname lúc start và tạo server entry cho MỖI địa chỉ
#      nhận được → 1 dòng `server backend:8080;` là đủ để round-robin qua
#      tất cả replica.  KHÔNG được lặp lại dòng `server` nhiều lần.
#   2. `resolve` (nginx >= 1.27.3): thay vì resolve 1 lần lúc start, Nginx hỏi
#      Docker DNS định kỳ và tự cập nhật danh sách IP của replica.  BẮT BUỘC
#      khi scale backend: nếu một replica restart nó sẽ đổi IP, còn Nginx đã
#      resolve từ lúc start vẫn giữ IP cũ → "Host is unreachable" →
#      mất 17–98 % request.  `zone` là bắt buộc để lưu trạng thái resolve.
#   3. `resolver` phải khai ở http context (file này được include trong http
#      block), KHÔNG khai trong `server {}` — nếu không nginx -t báo
#      "no resolver defined to resolve names at run time in upstream".

# log_format phải nằm ở http context.
log_format aives_upstream '$remote_addr "$request" $status '
                         'upstream=$upstream_addr rt=$request_time '
                         'urt=$upstream_response_time';

# Docker embedded DNS — BẮT BUỘC cho `server ... resolve` trong upstream.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream aives_backend {
    # Round robin (mặc định) — yêu cầu của đề bài: "Cấu hình Load Balancing
    # (Round Robin)".  `least_conn` được bật qua file include riêng khi cần
    # ưu tiên cân bằng theo số kết nối đang mở.
    #
    # Tham số:
    #   max_fails=3      → 3 lần lỗi liên tiếp thì tạm loại replica khỏi vòng
    #   fail_timeout=10s → sau 10 s không có request thành công thì thử lại
    #   resolve          → tự làm mới danh sách IP theo TTL của Docker DNS
    server backend:8080 resolve max_fails=3 fail_timeout=10s;

    zone aives_backend 64k;

    keepalive 64;
}

server {
    listen 8088;
    server_name _;

    # Endpoint submit nhận multipart lớn (audio) → nới giới hạn.
    client_max_body_size 50m;

    # Health check cho docker healthcheck.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Chặn route của nginx (vd /nginx_status) khỏi đi vào upstream.
    #
    # `stub_status` chỉ phục vụ exporter nội bộ trong Docker network
    # (nginx-prometheus-exporter).  Cho phép toàn bộ subnet Docker
    # (172.16.0.0/12) + loopback; chặn mọi nguồn ngoài.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;
    }

    location / {
        proxy_pass http://aives_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chấm bài / STT có thể mất thời gian → timeout rộng.
        proxy_connect_timeout 10s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        access_log /var/log/nginx/aives-access.log aives_upstream;
    }
}
