name: aives-dev

# Default pipeline: backend and AI run in Docker, Postgres is the Neon database
# named by ConnectionStrings__DefaultConnection in .env. The local Postgres
# service is only for an isolated database: docker compose --profile local-db up.
services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aives_dev
      POSTGRES_USER: aives
      POSTGRES_PASSWORD: aives-local-development
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aives -d aives_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    profiles: ["local-db"]
    build:
      context: ./backend
      dockerfile: Aives.Api/Dockerfile
    command: ["--Docker:InitializeDatabase=true"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=aives_dev;Username=aives;Password=aives-local-development
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      dockerfile: Aives.Api/Dockerfile
    ports:
      - "127.0.0.1:${DOCKER_BACKEND_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION:?Set DATABASE_CONNECTION in the root .env file}
      Database__SeedOnStartup: ${Database__SeedOnStartup:-false}
      # Phai khop voi backend/Aives.Api/appsettings.Development.json (Jwt:Key)
      # neu khong se sinh token khac nhau giuc local va Docker.
      Jwt__Key: ${Jwt__Key:-your-super-secret-jwt-key-with-at-least-32-chars-long}
      AI__BaseUrl: http://ai-service:8000
      AI__ApiKey: aives-dev-internal-key
      RateLimiting__LoginPermitLimit: ${LOGIN_RATE_LIMIT:-100}
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health/db"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "127.0.0.1:${DOCKER_AI_PORT:-8000}:8000"
    environment:
      AI_SERVICE_ENV: development
      # Provider lay tu .env (root) - mac dinh mock de khong lam vong Docker
      # bi that neu chua co key thật.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_SERVICE_SECRET_KEY: aives-dev-internal-key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_STT_MODEL: ${GEMINI_STT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      STT_MAX_RETRIES: ${STT_MAX_RETRIES:-5}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-3}
      # R2 dung chung bucket voi backend de STT doc audio vua ghi.
      R2_ACCOUNT_ID: ${CloudflareR2__AccountId:-}
      R2_ACCESS_KEY_ID: ${CloudflareR2__AccessKeyId:-}
      R2_SECRET_ACCESS_KEY: ${CloudflareR2__SecretAccessKey:-}
      R2_BUCKET_NAME: ${CloudflareR2__BucketName:-}
      BACKEND_URL: http://backend:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  frontend:
    build:
      context: ./frontend/aives-web
    ports:
      - "127.0.0.1:${DOCKER_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  uploads:
