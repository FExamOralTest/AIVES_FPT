name: aives-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aives_dev
      POSTGRES_USER: aives
      POSTGRES_PASSWORD: aives-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aives -d aives_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    build:
      context: ./backend
      dockerfile: Aives.Api/Dockerfile
    command: ["--Docker:InitializeDatabase=true"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=aives_dev;Username=aives;Password=aives-local-development
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Aives.Api/Dockerfile
    ports:
      - "127.0.0.1:${DOCKER_BACKEND_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=aives_dev;Username=aives;Password=aives-local-development
      Jwt__Key: aives-docker-local-development-key-32-characters
      AI__BaseUrl: http://ai-service:8000
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health/db"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "127.0.0.1:${DOCKER_AI_PORT:-8000}:8000"
    environment:
      AI_SERVICE_ENV: development
      AI_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      BACKEND_URL: http://backend:8080

  frontend:
    build:
      context: ./frontend/aives-web
    ports:
      - "127.0.0.1:${DOCKER_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  uploads:
