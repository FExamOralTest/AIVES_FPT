version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Aives.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - ENV=development
